name: Daily market briefing

on:
  schedule:
    # GitHub cron은 UTC 기준입니다.
    - cron: "10 22 * * 0-4"   # 한국시간 화~토 07:10 → 뉴욕 마감 브리핑
    - cron: "50 6 * * 1-5"    # 한국시간 월~금 15:50 → 서울 마감 브리핑
  workflow_dispatch: {}       # Actions 탭에서 수동 실행

permissions:
  contents: write

concurrency:
  group: briefing
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Build briefing
        run: python scripts/build_briefing.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}

      - name: Commit data
        run: |
          git config user.name "briefing-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          git diff --cached --quiet || git commit -m "briefing $(TZ=Asia/Seoul date +'%Y-%m-%d %H:%M')"
          git push
