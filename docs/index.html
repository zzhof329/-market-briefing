<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>나스닥·코스피 브리핑 아카이브</title>
<meta name="description" content="매일 아침 미국 증시 마감, 매일 오후 한국 증시 마감 브리핑을 쌓아두는 아카이브">
<!-- 홈 화면 앱 설정 -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="시장 브리핑">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#24415f" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1b3049" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@500;600;700&family=Noto+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* 레이아웃: 상단 고정 바(브리핑 선택·검색) → 탭 → 홈(요약·시장 카드·지수표·최근 브리핑) / 시장별 탭 / 아카이브. 상승 빨강·하락 파랑 */
:root{
  --bg:#eef1f4; --surface:#ffffff; --surface2:#f6f8fa; --ink:#18202b; --sub:#566273; --line:#d7dde4;
  --steel:#24415f; --steel-ink:#ffffff; --accent:#c4561d; --accent-soft:#fbeee6; --link:#24415f;
  --up:#cf2e3e; --upbg:#fbe8ea; --down:#1f5fc6; --downbg:#e6eefb; --flat:#7b8491; --flatbg:#eceff2;
  --f-display:"IBM Plex Sans KR","Noto Sans KR","Malgun Gothic",sans-serif;
  --f-body:"Noto Sans KR","Malgun Gothic","Apple SD Gothic Neo",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0f141a; --surface:#18202a; --surface2:#1f2833; --ink:#e4e9ef; --sub:#9aa6b4; --line:#2c3846;
  --steel:#1b3049; --steel-ink:#e8eef6; --accent:#e9874f; --accent-soft:#3a2416; --link:#9cc3ec;
  --up:#ff6b75; --upbg:#3d1a1f; --down:#6aa5ff; --downbg:#16263f; --flat:#9aa3ad; --flatbg:#252e38;
  color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0f141a; --surface:#18202a; --surface2:#1f2833; --ink:#e4e9ef; --sub:#9aa6b4; --line:#2c3846;
  --steel:#1b3049; --steel-ink:#e8eef6; --accent:#e9874f; --accent-soft:#3a2416; --link:#9cc3ec;
  --up:#ff6b75; --upbg:#3d1a1f; --down:#6aa5ff; --downbg:#16263f; --flat:#9aa3ad; --flatbg:#252e38;
  color-scheme:dark }
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 var(--f-body);font-variant-numeric:tabular-nums;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--steel)}
a{color:var(--link)}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1100px;margin:0 auto}

/* 상단 바 */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--steel);color:var(--steel-ink);
  margin-left:calc(-1*max(16px,env(safe-area-inset-left,0px)));margin-right:calc(-1*max(16px,env(safe-area-inset-right,0px)));
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top .in{max-width:1100px;margin:0 auto;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
.brand{font-family:var(--f-display);font-weight:700;font-size:17px;letter-spacing:-.01em;white-space:nowrap;cursor:pointer;background:none;border:0;color:inherit;padding:0}
.top select{max-width:58vw;padding:5px 8px;border-radius:6px;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.12);color:var(--steel-ink)}
.top select option{color:#18202b;background:#fff}
.search{display:flex;gap:6px;flex:1 1 260px;min-width:0}
.search input{flex:1;min-width:0;padding:6px 10px;border-radius:6px;border:0;background:#fff;color:#18202b}
.search button{padding:6px 12px;border-radius:6px;border:0;background:var(--accent);color:#fff;font-weight:700;font-size:13px;cursor:pointer;white-space:nowrap}
.sync{font-size:12px;opacity:.85;white-space:nowrap}
.sync i{display:inline-block;width:8px;height:8px;border-radius:50%;background:#5cc98c;margin-right:5px;vertical-align:1px}
.sync.sample i{background:#e8a94a}

/* 탭 */
.tabs{display:flex;gap:4px;overflow-x:auto;overflow-y:hidden;overscroll-behavior-x:contain;-webkit-overflow-scrolling:touch;
  box-shadow:inset 0 -2px 0 var(--line);scrollbar-width:none;
  position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--topH,56px));z-index:4;background:var(--bg);
  padding-top:14px;margin-left:-4px;margin-right:-4px;padding-left:4px;padding-right:4px}
/* 휴대폰: 제목·검색 바는 스크롤과 함께 올라가고 탭만 맨 위에 고정 */
@media (max-width:820px){
  .top{position:relative;top:auto}
  .tabs{top:env(safe-area-inset-top,0px);padding-top:8px;box-shadow:inset 0 -2px 0 var(--line),0 6px 8px -8px rgba(0,0,0,.25)}
}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;padding:9px 14px 8px;cursor:pointer;border:0;background:transparent;color:var(--sub);font-family:var(--f-display);font-weight:600;border-bottom:3px solid transparent}
.tab.on{color:var(--ink);border-bottom-color:var(--accent)}
.tab .cnt{font-family:var(--f-mono);font-weight:400;font-size:11.5px;margin-left:5px;color:var(--sub)}

/* 홈 */
.hero{margin-top:22px;display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:18px;align-items:end}
.hero .when{margin:0 0 6px;font-size:13px;color:var(--sub)}
.hero .when b{color:var(--accent);font-weight:700;margin-right:6px}
.hero h1{margin:0;font-family:var(--f-display);font-size:clamp(24px,4.2vw,34px);line-height:1.3;letter-spacing:-.02em;text-wrap:balance;word-break:keep-all}
.hero p.lede{margin:10px 0 0;color:var(--sub);max-width:60ch}
.facts{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end}
.fact{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 12px;min-width:104px}
.fact b{display:block;font-family:var(--f-display);font-size:20px;line-height:1.3}
.fact span{font-size:12px;color:var(--sub)}
.fact small{display:block;font-size:11px;color:var(--sub);margin-top:1px}
.closeline{display:flex;flex-wrap:wrap;gap:4px 14px;align-items:baseline;margin:12px 0 0;font-size:13px;color:var(--sub)}
.closeline b{color:var(--ink);margin-right:4px}
.livebadge{display:inline-block;font-size:11.5px;font-weight:700;color:#fff;background:var(--up);border-radius:4px;padding:1px 7px;margin-right:6px;vertical-align:1px}
.closeline .cl-l{font-size:11.5px;font-weight:700;color:#fff;background:var(--steel);border-radius:4px;padding:1px 7px}
.notice{margin-top:14px;background:var(--accent-soft);border:1px solid var(--line);border-radius:8px;padding:9px 13px;font-size:13.5px}

.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:20px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:4px}
.card:hover{border-color:var(--steel)}
.card .lbl{font-size:12px;font-weight:700;color:var(--accent)}
.card h3{margin:0;font-family:var(--f-display);font-size:17px}
.card .big{font-family:var(--f-display);font-size:22px;font-weight:700;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.card .big small{font-size:14px}
.card p{margin:0;font-size:13px;color:var(--sub)}
.card .cwhen{font-size:11.5px;color:var(--sub);line-height:1.35}
.card svg{width:100%;height:30px;margin-top:4px}

.sec{margin-top:30px}
.sec h2{margin:0;font-family:var(--f-display);font-size:19px;letter-spacing:-.01em}
.sec .desc{margin:4px 0 0;color:var(--sub);font-size:13.5px}
.cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:22px}
.shead{display:flex;flex-wrap:wrap;gap:10px 20px;align-items:flex-end;justify-content:space-between;margin-top:18px}

/* 표 */
.tablewrap{overflow-x:auto;margin-top:10px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
table{width:100%;border-collapse:collapse;font-size:14px}
th{background:var(--surface2);text-align:center;font-weight:600;color:var(--sub);font-size:12.5px;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle;text-align:center}
tr:last-child td{border-bottom:0}
td.n,th.n{text-align:center;white-space:nowrap}
td.nm{font-weight:700;white-space:nowrap}
td.nm small{display:block;font-weight:400;color:var(--sub);font-family:var(--f-mono);font-size:11.5px}
td.sp svg{width:90px;height:26px;display:block;margin:0 auto}
.mono{font-family:var(--f-mono);font-size:12.5px;color:var(--sub)}
.up{color:var(--up)} .down{color:var(--down)} .flat{color:var(--flat)}

/* 코멘트 박스 */
.memo{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--steel);border-radius:0 8px 8px 0;padding:14px 16px;margin-top:10px;word-break:keep-all}
.memo p{margin:0}
.watch{list-style:none;margin:10px 0 0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:10px}
.watch li{padding:10px 14px;border-bottom:1px solid var(--line);word-break:keep-all}
.watch li:last-child{border-bottom:0}

/* 목록 */
.list{list-style:none;margin:10px 0 0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:10px}
.list li{border-bottom:1px solid var(--line)}
.list li:last-child{border-bottom:0}
.list .row{display:flex;gap:10px;align-items:baseline;padding:10px 14px;width:100%;background:none;border:0;text-align:left;cursor:pointer;color:inherit}
.list .row:hover{background:var(--surface2)}
.list .row.cur{background:var(--accent-soft)}
.list .row .mono{flex:0 0 auto}
.list .row .t{flex:1;min-width:0}
.list .row .t b{font-weight:600}
.list .row .meta{display:flex;flex-wrap:wrap;gap:4px 6px;margin-top:4px;align-items:center;font-size:12.5px}
.more{display:inline-block;margin-top:8px;font-size:13px;background:none;border:0;padding:0;color:var(--link);text-decoration:underline;cursor:pointer}

.tag{font-size:11.5px;border-radius:4px;padding:1px 6px;background:var(--flatbg);color:var(--sub);white-space:nowrap}
.tag.us{background:var(--downbg);color:var(--down)}
.tag.kr{background:var(--upbg);color:var(--up)}
.tag.ses{background:var(--accent-soft);color:var(--accent)}
.chip{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:999px;padding:4px 11px;background:var(--surface);cursor:pointer;user-select:none;font-size:13px}
.chip.on{background:var(--steel);border-color:var(--steel);color:var(--steel-ink)}
.frow{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.flbl{font-size:12.5px;color:var(--sub);margin-right:4px;min-width:34px}
.filters{display:grid;gap:8px;margin-top:12px}
.filters input{width:100%;padding:8px 12px;border-radius:8px;border:1px solid var(--line);background:var(--surface)}

/* 섹터 막대 */
.bars{display:grid;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;margin-top:10px}
.bar{display:grid;grid-template-columns:84px 1fr 62px;align-items:center;gap:10px;font-size:13.5px}
.bar .track{position:relative;height:14px}
.bar .track::before{content:"";position:absolute;left:50%;top:-3px;bottom:-3px;width:1px;background:var(--line)}
.bar .fill{position:absolute;top:1px;height:12px;border-radius:2px}
.bar .v{text-align:right;font-weight:700}

/* 뉴스 */
.news li{padding:12px 14px}
.news a{font-weight:600;text-decoration:none;color:var(--ink)}
.news a:hover{text-decoration:underline}
.news .why{margin:4px 0 0;font-size:13.5px;color:var(--sub)}

/* 달력 */
.calnav{display:flex;align-items:center;gap:8px}
.calnav button{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:4px 10px;cursor:pointer;font-weight:700}
.calnav b{font-family:var(--f-display);font-size:17px;min-width:110px;text-align:center}
.extlink{display:inline-block;font-size:13px;font-weight:600;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:5px 10px;text-decoration:none;color:var(--link)}
.cal{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;margin-top:12px}
.cal .dow{font-size:12px;font-weight:700;color:var(--sub);text-align:center;padding:2px 0}
.cell{background:var(--surface);border:1px solid var(--line);border-radius:8px;min-height:96px;padding:6px 7px;display:flex;flex-direction:column;gap:3px;min-width:0;text-align:left;font:inherit;color:inherit}
.cell.out{background:transparent;border-style:dashed;opacity:.45}
.cell.hot{background:var(--accent-soft);border-color:var(--accent)}
.cell.today{outline:2px solid var(--steel);outline-offset:-2px}
.cell .d{font-family:var(--f-display);font-weight:700;font-size:14px}
.cell .ev{font-size:12px;line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cell .ev i{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:3px;vertical-align:2px}
.cell .ev i.us{background:var(--down)} .cell .ev i.kr{background:var(--up)}
button.cell{cursor:pointer}
button.cell:hover{border-color:var(--steel)}
.cell.sel{outline:2px solid var(--accent);outline-offset:-2px}
.daypanel{grid-column:1 / -1;background:var(--surface);border:1px solid var(--accent);border-radius:10px;padding:10px 14px}
.daypanel .ph{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.daypanel .ph b{font-family:var(--f-display);font-size:15px}
.daypanel .ph button{border:0;background:none;font-size:20px;line-height:1;cursor:pointer;color:var(--sub);padding:2px 6px}
.legend{display:flex;gap:12px;font-size:12.5px;color:var(--sub);margin-top:8px;flex-wrap:wrap}
.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px;vertical-align:0}
.cell .ev.i3{font-weight:700;color:var(--accent)}
.cell .more2{font-size:11px;color:var(--sub)}
.evlist .day{padding:10px 14px;border-bottom:1px solid var(--line)}
.evlist .day:last-child{border-bottom:0}
.evlist .dh{font-family:var(--f-display);font-weight:700;font-size:14px;margin-bottom:4px}
.evlist .dh.today::after{content:"오늘";margin-left:6px;font-size:11px;color:#fff;background:var(--steel);border-radius:4px;padding:1px 6px;vertical-align:1px}
.evrow{display:flex;gap:8px;align-items:baseline;padding:3px 0;font-size:14px}
.evrow .mono{flex:0 0 42px}
.evrow .t{flex:1;min-width:0}
.evrow .t.i3{font-weight:700}
.evrow .star{color:var(--accent)}
.evrow small{display:block;color:var(--sub);font-size:12.5px}
/* 역대 월별 */
.season-sum{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:12px}
.heat td,.heat th{text-align:center;padding:5px 4px;font-size:12px;white-space:nowrap}
.heat th:first-child,.heat td:first-child{position:sticky;left:0;background:var(--surface2);z-index:1;font-family:var(--f-mono)}
.heat td.cur{outline:2px solid var(--steel);outline-offset:-2px}
.heat tr.sum td{font-weight:700;background:var(--surface2)}
/* 심층 분석 */
.ana{margin-top:20px;background:var(--surface);border:1px solid var(--line);border-top:3px solid var(--accent);border-radius:10px;padding:16px 18px}
.ana .badge{display:inline-block;font-size:12px;font-weight:700;color:#fff;background:var(--accent);border-radius:4px;padding:2px 8px;margin-right:6px;vertical-align:2px}
.ana .trig{font-size:13px;color:var(--sub)}
.ana h2{margin:8px 0 6px;font-family:var(--f-display);font-size:20px;line-height:1.35;word-break:keep-all}
.ana .sum{margin:0;word-break:keep-all}
.ana h3{font-size:14px;margin:16px 0 6px;color:var(--sub)}
.ana details{border-top:1px solid var(--line);padding:9px 0}
.ana details:last-of-type{border-bottom:1px solid var(--line)}
.ana summary{cursor:pointer;font-weight:700;list-style:none;display:flex;gap:8px;align-items:baseline}
.ana summary::-webkit-details-marker{display:none}
.ana summary::after{content:"＋";margin-left:auto;color:var(--sub);font-weight:400}
.ana details[open] summary::after{content:"－"}
.ana details p{margin:6px 0 2px;word-break:keep-all}
.ana .w{font-size:11.5px;border-radius:4px;padding:1px 6px;white-space:nowrap;font-weight:700}
.ana .w.high{background:var(--upbg);color:var(--up)} .ana .w.mid{background:var(--accent-soft);color:var(--accent)} .ana .w.low{background:var(--flatbg);color:var(--sub)}
.ana ul{margin:0;padding-left:18px} .ana li{margin:3px 0;word-break:keep-all}
.ana .src{font-size:13px;display:flex;flex-direction:column;gap:3px}
.ana .src a{color:var(--link);text-decoration:none} .ana .src a:hover{text-decoration:underline}
.tag.ana-t{background:var(--accent);color:#fff}
.ana.daily{border-top-color:var(--steel)}
.ana.daily .badge{background:var(--steel)}
.stance{display:inline-block;font-weight:700;border-radius:6px;padding:3px 10px;font-size:14px}
.stance.up{background:var(--upbg);color:var(--up)} .stance.down{background:var(--downbg);color:var(--down)} .stance.flat{background:var(--flatbg);color:var(--sub)}
.ol-head{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ol-head .mono{font-size:12.5px}
.scen{display:grid;gap:6px;margin-top:8px}
.scen div{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface2);word-break:keep-all}
.scen b{white-space:nowrap}
.scen small{color:var(--sub);font-size:12px;display:block;font-weight:400}
.disc{margin:12px 0 0;font-size:12px;color:var(--sub)}
.dir{display:inline-block;font-size:12px;font-weight:700;border-radius:4px;padding:1px 6px;margin-top:4px;white-space:nowrap}
.dir.up{background:var(--upbg);color:var(--up)} .dir.down{background:var(--downbg);color:var(--down)} .dir.flat{background:var(--flatbg);color:var(--sub)}
.fng{display:flex;align-items:center;gap:10px}
.fng .bar{flex:1;height:8px;border-radius:4px;background:linear-gradient(90deg,var(--down),#9aa3ad,var(--up));position:relative}
.fng .bar i{position:absolute;top:-4px;width:4px;height:16px;border-radius:2px;background:var(--ink)}
.tag.st-up{background:var(--upbg);color:var(--up)} .tag.st-down{background:var(--downbg);color:var(--down)} .tag.st-flat{background:var(--flatbg);color:var(--sub)}
small.krw{display:block;color:var(--sub);font-size:12px;font-weight:400;white-space:nowrap}
/* 월별 등락 */
.mchart{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 8px 8px;margin-top:10px}
.mcol{display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:0;padding:4px 0;border-radius:6px;cursor:pointer;color:inherit;font:inherit;min-width:0}
.mcol:hover{background:var(--surface2)}
.mcol.sel{background:var(--accent-soft);outline:2px solid var(--accent);outline-offset:-2px}
.mcol .v{font-size:10.5px;font-weight:700;white-space:nowrap}
.mcol .area{position:relative;width:100%;height:120px}
.mcol .area::before{content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:var(--line)}
.mcol .b{position:absolute;left:22%;right:22%;border-radius:2px}
.mcol .m{font-size:12px;font-weight:700;white-space:nowrap}
.mcol .u{font-size:10.5px;color:var(--sub);white-space:nowrap}
.yrs{display:grid;gap:5px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-top:10px}
.yr{display:grid;grid-template-columns:44px 1fr 62px;align-items:center;gap:8px;font-size:13px}
.yr .track{position:relative;height:14px}
.yr .track::before{content:"";position:absolute;left:50%;top:-3px;bottom:-3px;width:1px;background:var(--line)}
.yr .fill{position:absolute;top:1px;height:12px;border-radius:2px}
.yr .v{text-align:right;font-weight:700}
.heatwrap summary{cursor:pointer;font-weight:700;margin-top:22px}
@media (max-width:480px){ .mchart{gap:2px;padding:10px 4px 6px} .mcol .v{font-size:9px;letter-spacing:-.04em} .mcol .u{font-size:9px;letter-spacing:-.03em} .mcol .m{font-size:10.5px;letter-spacing:-.04em} .mcol .area{height:100px} }
.analist .row .t b{display:block}
.analist .open{padding:4px 12px 14px}
.analist .open .ana{margin-top:6px}
.links{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px}
.empty{padding:24px 14px;color:var(--sub);text-align:center}
footer{margin:40px 0 28px;padding-top:14px;border-top:1px solid var(--line);font-size:12.5px;color:var(--sub)}

@media (max-width:820px){
  .hero,.cols,.links{grid-template-columns:minmax(0,1fr)}
  .facts{justify-content:flex-start}
  .cards{grid-template-columns:repeat(2,minmax(0,1fr))}
  .season-sum{grid-template-columns:repeat(2,minmax(0,1fr))}
  .cell{min-height:58px;padding:4px 4px}
  .cell .ev{font-size:11px;letter-spacing:-.02em}
  .cell .ev i{display:none}
}
/* 휴대폰: 표는 핵심 칸만, 이름은 줄바꿈 허용 */
.show-m{display:none}
@media (max-width:820px){
  .hide-m{display:none}
  .show-m{display:inline}
  .show-m.blk{display:block}
  td.nm{white-space:normal;word-break:keep-all;line-height:1.35}
  td,th{padding:8px 7px}
  table{font-size:13.5px}
}
@media (max-width:480px){
  .sync{display:none}
  .fact{min-width:0;flex:1 1 40%}
}
</style>
</head>
<body>
<div class="top"><div class="in">
  <button class="brand" id="brand" type="button">나스닥·코스피 브리핑 아카이브</button>
  <select id="pick" aria-label="브리핑 선택"></select>
  <form class="search" id="searchForm" role="search">
    <input id="topQ" type="search" placeholder="지난 브리핑 검색 (예: 반도체, 환율, 엔비디아)" aria-label="브리핑 검색">
    <button type="submit">검색</button>
  </form>
  <div class="sync" id="sync"><i></i><span>불러오는 중</span></div>
</div></div>

<div class="wrap">
  <nav class="tabs" id="tabs" aria-label="메뉴"></nav>
  <main id="view"><p class="empty">브리핑을 불러오는 중입니다.</p></main>
  <footer>
    시세는 Yahoo Finance(yfinance) 지연 시세, 뉴스는 Google News, 코멘트는 Claude가 자동 작성합니다. 수치에 오류가 있을 수 있으니 원 출처에서 확인하세요.
    이 사이트는 정보 제공용이며 투자 권유가 아닙니다. 투자 판단과 책임은 본인에게 있습니다.
  </footer>
</div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/<\/?cite[^>]*>/g, "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const dir = v => v > 0 ? "up" : v < 0 ? "down" : "flat";
const arrow = v => v > 0 ? "▲" : v < 0 ? "▼" : "–";
const nf = (v, d = 2) => Number(v).toLocaleString("ko-KR", {minimumFractionDigits: d, maximumFractionDigits: d});
const pct = v => v == null ? "–" : `${v > 0 ? "+" : ""}${nf(v)}%`;
const sesName = s => s === "morning" ? "미국 증시 마감" : s === "intraday" ? "장중" : "한국 증시 마감";
const md = d => d ? d.slice(5).replace("-", ".") : "";

const EMBED = window.BRIEFING_EMBED || null;   // 미리보기용: 데이터가 페이지 안에 들어 있으면 그걸 사용
const S = {tab: "home", doc: null, key: "latest", index: [], q: "", month: "all", ses: "all", tag: null, newsMk: "all", cache: {},
  cal: null, season: null, calMonth: null, seasonIdx: 0, seasonAll: false, stockSort: "cap", krBoard: "kospi", anaMk: null, krCap: "kr", seasonMon: null, seasonWin: "all"};

const TABS = [
  ["home", "홈"], ["us", "미국 시장"], ["kr", "한국 시장"], ["coin", "코인"], ["macro", "환율·금리"],
  ["calendar", "달력"], ["season", "월별 등락"], ["news", "뉴스"], ["archive", "아카이브"], ["links", "바로가기"],
];
const US_IDX = ["^IXIC", "^NDX", "^GSPC", "^DJI", "^SOX", "^VIX"], KR_IDX = ["^KS11", "^KQ11"];

const LINKS = [
  ["한국 시장", [
    ["KRX 정보데이터시스템", "https://data.krx.co.kr", "투자자별 매매동향, 업종 지수"],
    ["DART 전자공시", "https://dart.fss.or.kr", "상장사 공시·실적"],
    ["네이버 증권", "https://finance.naver.com", "종목 시세·리서치 리포트"],
    ["한국은행 ECOS", "https://ecos.bok.or.kr", "국고채 금리, 환율, 경제통계"],
  ]],
  ["미국 시장", [
    ["Nasdaq 마켓", "https://www.nasdaq.com/market-activity", "지수·종목 시세, 실적 일정"],
    ["SEC EDGAR", "https://www.sec.gov/edgar/search/", "미국 기업 공시(10-K, 10-Q)"],
    ["Yahoo Finance", "https://finance.yahoo.com", "종목 차트·뉴스"],
    ["FRED", "https://fred.stlouisfed.org", "미국 금리·경제지표 시계열"],
  ]],
  ["일정·정책", [
    ["연준 FOMC 일정", "https://www.federalreserve.gov/monetarypolicy/fomccalendars.htm", "금리 결정 회의 일정"],
    ["CME FedWatch", "https://www.cmegroup.com/markets/interest-rates/cme-fedwatch-tool.html", "금리 인하·인상 확률"],
    ["인베스팅닷컴 경제 캘린더", "https://kr.investing.com/economic-calendar/", "국가별 지표 발표 일정"],
  ]],
];

/* ── 데이터 ─────────────────────────────────── */
async function getJSON(path) {
  const r = await fetch(`${path}?t=${Date.now()}`);
  if (!r.ok) throw new Error(`${path} ${r.status}`);
  return r.json();
}
async function getDoc(key) {
  if (S.cache[key]) return S.cache[key];
  let d;
  if (EMBED) d = key === "latest" ? EMBED.latest : EMBED.items[key];
  else d = await getJSON(key === "latest" ? "data/latest.json" : `data/archive/${encodeURIComponent(key)}.json`);
  if (!d) throw new Error("not found");
  return (S.cache[key] = d);
}
async function getExtra(name) {
  try { return EMBED ? EMBED[name] : await getJSON(`data/${name}.json`); } catch { return null; }
}
async function getIndex() {
  try { return EMBED ? EMBED.index : await getJSON("data/archive/index.json"); } catch { return []; }
}

/* ── 작은 부품 ───────────────────────────────── */
function spark(values, d, w = 90, h = 26) {
  if (!values || values.length < 2) return "";
  const mn = Math.min(...values), mx = Math.max(...values), r = (mx - mn) || 1;
  const pts = values.map((v, i) => `${(i / (values.length - 1) * w).toFixed(1)},${(h - 2 - (v - mn) / r * (h - 4)).toFixed(1)}`).join(" ");
  return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true"><polyline points="${pts}" fill="none" stroke="var(--${d})" stroke-width="1.6" stroke-linejoin="round" vector-effect="non-scaling-stroke"/></svg>`;
}
const pick = ids => ids.map(id => S.doc.indices.find(i => i.symbol === id)).filter(Boolean);
const find = (list, sym) => (list || []).find(x => x.symbol === sym);

function idxTable(list) {
  if (!list.length) return `<p class="empty">데이터 없음</p>`;
  return `<div class="tablewrap"><table><thead><tr><th>지수</th><th class="n">종가</th><th class="n hide-m">전일 대비</th><th class="n">등락률</th><th class="hide-m">20일 추이</th><th class="n hide-m">기준일</th></tr></thead><tbody>
  ${list.map(i => { const d = dir(i.change); return `<tr><td class="nm">${esc(i.name)}<small>${esc(i.symbol)}</small></td>
    <td class="n"><b>${nf(i.price)}</b></td><td class="n ${d} hide-m">${arrow(i.change)} ${nf(Math.abs(i.change))}</td>
    <td class="n ${d}"><b>${pct(i.pct)}</b><small class="show-m blk" style="font-weight:400">${arrow(i.change)} ${nf(Math.abs(i.change))}</small></td><td class="sp hide-m">${spark(i.spark, d)}</td><td class="n mono hide-m">${md(i.date)}</td></tr>`; }).join("")}
  </tbody></table></div>`;
}

// 달러 → 원화 환산 (그날 원/달러 환율)
const usdkrw = () => (S.doc?.macro || []).find(m => m.symbol === "KRW=X")?.price || S.doc?.crypto?.usdkrw || null;
const wonShort = v => v >= 1e8 ? `${nf(v / 1e8, 2)}억 원` : v >= 1e4 ? `${nf(v / 1e4, 1)}만 원` : `${nf(v, 0)}원`;
const krwSub = usd => { const r = usdkrw(); return r && usd ? `<small class="krw">약 ${wonShort(usd * r)}</small>` : ""; };

function stockTable(list, mk) {
  if (!list?.length) return `<p class="empty">데이터 없음</p>`;
  const fmt = v => mk === "kr" ? `${nf(v, 0)}원` : `$${nf(v)}`;
  const capFmt = c => !c ? "–" : mk === "kr" ? `${nf(c / 1e12, 0)}조 원` : `${nf(c / 1e12, 2)}조 달러`;
  const rows = S.stockSort === "pct" ? [...list].sort((a, b) => b.pct - a.pct)
    : [...list].sort((a, b) => (a.rank || 99) - (b.rank || 99) || (b.cap || 0) - (a.cap || 0));
  return `<div class="tablewrap"><table><thead><tr><th class="n">순위</th><th>종목</th><th class="n">종가</th><th class="n">등락률</th><th class="n hide-m">시가총액</th><th class="hide-m">20일 추이</th></tr></thead><tbody>
  ${rows.map((s, i) => { const d = dir(s.pct); return `<tr><td class="n mono">${s.rank || i + 1}</td><td class="nm">${esc(s.name)}<small>${esc(s.symbol.replace(/\.K[SQ]$/, ""))}<span class="show-m"> · ${capFmt(s.cap)}</span></small></td>
    <td class="n">${fmt(s.price)}${mk === "us" ? krwSub(s.price) : ""}</td><td class="n ${d}"><b>${pct(s.pct)}</b></td><td class="n mono hide-m">${capFmt(s.cap)}</td><td class="sp hide-m">${spark(s.spark, d)}</td></tr>`; }).join("")}
  </tbody></table></div>`;
}

function moverTable(list, mk, title) {
  if (!list?.length) return `<div><h3 style="margin:0;font-size:15px">${title}</h3><p class="empty">해당 종목이 없거나 데이터를 받지 못했습니다.</p></div>`;
  const fmt = v => v == null ? "–" : mk === "us" ? `$${nf(v)}` : `${nf(v, 0)}원`;
  return `<div><h3 style="margin:0;font-size:15px">${title}</h3><div class="tablewrap"><table><thead><tr><th class="n">#</th><th>종목</th><th class="n">종가</th><th class="n">등락률</th></tr></thead><tbody>
    ${list.map((r, i) => `<tr><td class="n mono">${i + 1}</td><td class="nm">${esc(r.name)}<small>${esc(r.symbol)}${r.name_en ? `<span class="hide-m"> · ${esc(r.name_en)}</span>` : ""}</small></td><td class="n">${fmt(r.price)}${mk === "us" ? krwSub(r.price) : ""}</td><td class="n ${dir(r.pct)}"><b>${pct(r.pct)}</b></td></tr>`).join("")}
  </tbody></table></div></div>`;
}

function viewMovers(mk) {
  const mv = S.doc.movers;
  if (!mv) return "";
  const board = mk === "us" ? mv.us : mv[S.krBoard];
  if (!board || (!board.up?.length && !board.down?.length))
    return mk === "kr" ? `<section class="sec"><h2>오늘의 상승·하락 상위</h2><p class="empty">오늘은 순위 데이터를 받지 못했습니다. 다음 업데이트 때 다시 시도합니다.</p></section>` : "";
  const chip = (v, l) => `<button class="chip ${S.krBoard === v ? "on" : ""}" type="button" data-krboard="${v}">${l}</button>`;
  return `<section class="sec">
    <div class="shead" style="margin-top:0"><div><h2>오늘의 상승·하락 상위</h2>
      <p class="desc">${mk === "us" ? "시가총액 20억 달러 이상 미국 종목, Yahoo Finance 기준"
        : board.src === "pool" ? `우선주·스팩·ETN 제외. ${board.src_detail?.up === "pool" && board.src_detail?.down === "pool" ? "오늘은" : board.src_detail?.up === "pool" ? "상승 쪽은" : "하락 쪽은"} 전체 순위를 받지 못해 대형주 안에서 정렬했습니다` : "우선주·스팩·ETN 제외, 네이버 증권 기준"}</p></div>
      ${mk === "kr" ? `<div class="frow">${chip("kospi", "코스피")}${chip("kosdaq", "코스닥")}</div>` : ""}</div>
    <div class="cols" style="margin-top:10px">${moverTable(board.up, mk === "us" ? "us" : "kr", "상승 상위")}${moverTable(board.down, mk === "us" ? "us" : "kr", "하락 상위")}</div>
  </section>`;
}

function sectorBars(list) {
  if (!list?.length) return `<p class="empty">데이터 없음</p>`;
  const sorted = [...list].sort((a, b) => b.pct - a.pct);
  const m = Math.max(...sorted.map(s => Math.abs(s.pct)), .5);
  return `<div class="bars">${sorted.map(s => {
    const w = Math.abs(s.pct) / m * 50, d = dir(s.pct);
    const pos = s.pct >= 0 ? `left:50%;width:${w}%` : `left:${50 - w}%;width:${w}%`;
    return `<div class="bar"><span>${esc(s.name)}</span><div class="track"><div class="fill" style="${pos};background:var(--${d})"></div></div><span class="v ${d}">${pct(s.pct)}</span></div>`;
  }).join("")}</div>`;
}

function macroTable(list) {
  const val = m => m.unit === "pct" ? `${nf(m.price, 3)}%` : m.unit === "krw" ? `${nf(m.price)}원` : m.unit === "krw100" ? `${nf(m.price * 100)}원`
    : m.unit === "jpy" ? `¥${nf(m.price)}` : m.unit === "usd" ? `$${nf(m.price)}` : nf(m.price);
  const chg = m => m.unit === "pct" ? `${m.change > 0 ? "+" : ""}${nf(m.change * 100, 1)}bp` : pct(m.pct);
  const OZ = 31.1035, DON = 3.75;
  const sub = m => {
    const r = usdkrw();
    if (m.unit !== "usd" || !r) return "";
    if (m.symbol === "GC=F") { const g = m.price * r / OZ;
      return `<small class="krw">1돈 ${nf(g * DON, 0)}원</small><small class="krw">1g ${nf(g, 0)}원</small>`; }
    if (m.symbol === "CL=F") return `<small class="krw">배럴당 약 ${wonShort(m.price * r)}</small>`;
    return krwSub(m.price);
  };
  return `<div class="tablewrap"><table><thead><tr><th>지표</th><th class="n">현재</th><th class="n">변동</th><th class="hide-m">20일 추이</th><th class="n hide-m">기준일</th></tr></thead><tbody>
  ${(list || []).map(m => { const d = dir(m.change); return `<tr><td class="nm">${esc(m.name)}<small>${esc(m.symbol)}</small></td><td class="n"><b>${val(m)}</b>${sub(m)}</td>
    <td class="n ${d}">${chg(m)}</td><td class="sp hide-m">${spark(m.spark, d)}</td><td class="n mono hide-m">${md(m.date)}</td></tr>`; }).join("")}
  </tbody></table></div>`;
}

function newsList(list, limit) {
  if (!list?.length) return `<p class="empty">수집된 뉴스가 없습니다.</p>`;
  const sorted = [...list].sort((a, b) => (b.note ? 1 : 0) - (a.note ? 1 : 0)).slice(0, limit || 99);
  return `<ul class="list news">${sorted.map(n => `<li>
    <span class="tag ${n.market}">${n.market === "us" ? "미국" : "한국"}</span>
    <a href="${esc(n.link)}" target="_blank" rel="noopener">${esc(n.title)}</a>
    ${n.source ? `<span class="mono"> ${esc(n.source)}</span>` : ""}
    ${n.note ? `<p class="why">${esc(n.note)}</p>` : ""}</li>`).join("")}</ul>`;
}

function briefRow(e) {
  const cur = e.key === S.key || (S.key === "latest" && e.key === `${S.doc?.date}-${S.doc?.session}`);
  return `<li><button class="row ${cur ? "cur" : ""}" type="button" data-open="${esc(e.key)}">
    <span class="mono">${md(e.date)}${e.session === "intraday" && e.time ? `<br>${esc(e.time)}` : ""}</span>
    <span class="t"><b>${esc(e.headline)}</b>
      <span class="meta">${e.analysis ? `<span class="tag ana-t">심층 분석</span>` : ""}${e.stance ? `<span class="tag st-${stCls(e.stance)}">전망 ${esc(e.stance)}</span>` : ""}<span class="tag ses">${sesName(e.session)}</span>
        <span class="${dir(e.us_pct)}">나스닥 ${pct(e.us_pct)}</span><span class="${dir(e.kr_pct)}">코스피 ${pct(e.kr_pct)}</span>
        ${(e.tags || []).map(t => `<span class="tag">#${esc(t)}</span>`).join("")}</span>
      ${e.analysis && e.analysis_title ? `<span class="meta" style="color:var(--accent);font-weight:600">심층 분석 · ${esc(e.analysis_title)}</span>` : ""}</span>
  </button></li>`;
}

/* ── 장 마감 시점 ─────────────────────────────── */
const WD = ["일", "월", "화", "수", "목", "금", "토"];
function nthSunday(y, m, n) { const d = new Date(Date.UTC(y, m, 1)); d.setUTCDate(1 + (7 - d.getUTCDay()) % 7 + 7 * (n - 1)); return d; }
function usDST(ds) {  // 미국 서머타임: 3월 둘째 일요일 ~ 11월 첫째 일요일
  const d = new Date(ds + "T12:00:00Z"), y = d.getUTCFullYear();
  return d >= nthSunday(y, 2, 2) && d < nthSunday(y, 10, 1);
}
const mdw = d => `${d.getUTCMonth() + 1}/${d.getUTCDate()}(${WD[d.getUTCDay()]})`;
function closeInfo(market, ds) {
  if (!ds) return null;
  const day = new Date(ds + "T00:00:00Z");
  const live = S.doc?.intraday;
  if (live?.[market]) {  // 장중 브리핑: 아직 마감 전 가격
    const t = `${mdw(day)} ${live.at} 현재`;
    return {local: t, kst: t, short: `${mdw(day)} ${live.at} 장중`, live: true};
  }
  if (market === "kr") return {local: `${mdw(day)} 15:30`, kst: `${mdw(day)} 15:30`, short: `${mdw(day)} 마감`};
  // 미국: 뉴욕 16:00 → 한국 다음날 06:00 (서머타임 05:00)
  const kst = new Date(Date.UTC(day.getUTCFullYear(), day.getUTCMonth(), day.getUTCDate(), 16 + (usDST(ds) ? 4 : 5) + 9));
  return {local: `${mdw(day)} 16:00 뉴욕`, kst: `${mdw(kst)} ${String(kst.getUTCHours()).padStart(2, "0")}:00 한국`, short: `${mdw(day)} 마감`, dst: usDST(ds)};
}
function closeLine(which) {
  const d = S.doc, ix = s => (d.indices || []).find(i => i.symbol === s);
  const us = closeInfo("us", ix("^IXIC")?.date || ix("^GSPC")?.date), kr = closeInfo("kr", ix("^KS11")?.date);
  const parts = [];
  if (us && which !== "kr") parts.push(us.live ? `<span><b>미국</b> ${us.kst} 한국시간 (장중)</span>`
    : `<span><b>미국</b> ${us.local} <span class="mono">=</span> ${us.kst}${us.dst ? " (서머타임)" : ""}</span>`);
  if (kr && which !== "us") parts.push(kr.live ? `<span><b>한국</b> ${kr.local} (장중)</span>` : `<span><b>한국</b> ${kr.local} 마감</span>`);
  return parts.length ? `<p class="closeline"><span class="cl-l">기준 시점</span>${parts.join("")}</p>` : "";
}

/* ── 화면 ───────────────────────────────────── */
const DIR_LABEL = {up: "↗ 상승", flat: "→ 등락", down: "↘ 하락"};
function scenDir(x) {
  if (["up", "flat", "down"].includes(x.direction)) return x.direction;
  const d = x.desc || "";
  if (/상방/.test(x.name)) return "up";
  if (/하방/.test(x.name)) return "down";
  if (/반등|상승|회복/.test(d) && !/하락|약세|투매|이탈/.test(d)) return "up";
  if (/하락|약세|투매|이탈|붕괴/.test(d) && !/반등|회복/.test(d)) return "down";
  return "flat";
}
const stCls = st => st === "상승 우위" ? "up" : st === "하락 우위" ? "down" : "flat";

function viewOutlook(o) {
  if (!o) return "";
  return `<h3>앞으로의 방향성</h3>
    <div class="ol-head"><span class="stance ${stCls(o.stance)}">${esc(o.stance)}</span>${o.horizon ? `<span class="mono">${esc(o.horizon)} 기준</span>` : ""}</div>
    ${o.reason ? `<p class="sum" style="margin-top:8px">${esc(o.reason)}</p>` : ""}
    ${o.scenarios?.length ? `<div class="scen">${o.scenarios.map(x => { const dr = scenDir(x); return `<div><b>${esc(x.name)}<small>가능성 ${esc(x.likelihood || "–")}</small><span class="dir ${dr}">${DIR_LABEL[dr]}</span></b><span>${esc(x.desc)}</span></div>`; }).join("")}</div>` : ""}
    ${o.levels?.length ? `<h3>볼 만한 지수 수준</h3><ul>${o.levels.map(l => `<li>${esc(l)}</li>`).join("")}</ul>` : ""}
    <p class="disc">전망은 공개된 시세·보도를 바탕으로 한 조건부 시나리오이며, 투자 권유가 아닙니다.</p>`;
}

function viewAnalysis(a) {
  if (!a) return "";
  const wcls = w => w === "높음" ? "high" : w === "낮음" ? "low" : "mid";
  const causes = cs => (cs || []).map((c, i) => `<details ${i === 0 ? "open" : ""}><summary><span class="w ${wcls(c.weight)}">영향 ${esc(c.weight)}</span>${esc(c.title)}</summary><p>${esc(c.detail)}</p></details>`).join("");
  // 예전 형식(시장 구분 없음)도 하나의 파트로 보여주기
  const parts = a.parts?.length ? a.parts : [{market: "", title: "", summary: "", causes: a.causes, reaction: a.reaction,
    outlook: a.outlook && !Array.isArray(a.outlook) ? a.outlook : null}];
  const mk = parts.some(x => x.market === S.anaMk) ? S.anaMk : parts[0].market;
  const part = parts.find(x => x.market === mk) || parts[0];
  const mkName = m => m === "kr" ? "한국 증시" : m === "crypto" ? "코인" : "미국 증시";
  const watch = a.watch || (Array.isArray(a.outlook) ? a.outlook : []);
  return `<section class="ana" aria-label="심층 분석">
    <div><span class="badge">심층 분석</span><span class="trig">${a.triggers.map(esc).join(" · ")}${a.reused ? " · 오늘 아침 분석" : ""}</span></div>
    <h2>${esc(a.title || "왜 이렇게 움직였나")}</h2>
    <p class="sum">${esc(a.summary)}</p>
    ${parts.length > 1 ? `<div class="frow" style="margin-top:14px">${parts.map(x => `<button class="chip ${x.market === mk ? "on" : ""}" type="button" data-anamk="${x.market}">${mkName(x.market)}</button>`).join("")}</div>`
      : part.market ? `<h3 style="margin-top:14px">${mkName(part.market)}</h3>` : ""}
    ${part.title ? `<p style="margin:10px 0 4px;font-weight:700;word-break:keep-all">${esc(part.title)}</p>` : ""}
    ${part.summary ? `<p class="sum">${esc(part.summary)}</p>` : ""}
    <h3>주요 원인</h3>${causes(part.causes)}
    ${part.reaction ? `<h3>업종·종목 반응</h3><p class="sum">${esc(part.reaction)}</p>` : ""}
    ${viewOutlook(part.outlook)}
    ${a.link ? `<h3>미국·한국 증시 연결고리</h3><p class="sum">${esc(a.link)}</p>` : ""}
    ${a.history ? `<h3>과거 비슷한 사례</h3><p class="sum">${esc(a.history)}</p>` : ""}
    ${watch.length ? `<h3>앞으로 볼 변수</h3><ul>${watch.map(o => `<li>${esc(o)}</li>`).join("")}</ul>` : ""}
    ${a.sources?.length ? `<h3>참고한 기사</h3><div class="src">${a.sources.map(x => `<a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.title || x.url)}</a>`).join("")}</div>` : ""}
  </section>`;
}

function viewDaily(d) {
  if (d.analysis || (!d.drivers?.length && !d.outlook)) return "";
  return `<section class="ana daily" aria-label="오늘의 분석과 전망">
    <div><span class="badge">오늘의 분석</span><span class="trig">${sesName(d.session)} 기준</span></div>
    ${d.drivers?.length ? `<h3 style="margin-top:12px">오늘 움직인 이유</h3><ul>${d.drivers.map(x => `<li>${esc(x)}</li>`).join("")}</ul>` : ""}

}

}

function archiveMatches() {

    (!q || [e.headline, e.summary, ...(e.tags || []), ...(e.keywords || [])].join(" ").toLowerCase().includes(q)));
}

    <div class="frow"><span class="flbl">기간</span>${chip("month", "all", S.month, "전체")}${months.map(m => chip("month", m, S.month, `${m.slice(0, 4)}년 ${+m.slice(5)}월`)).join("")}</div>
    <div class="frow"><span class="flbl">구분</span>${chip("ses", "all", S.ses, "전체")}${chip("ses", "morning", S.ses, "미국 증시 마감")}${chip("ses", "afternoon", S.ses, "한국 증시 마감")}${chip("ses", "intraday", S.ses, "장중")}${chip("ses", "analysis", S.ses, "심층 분석만")}</div>
    ${tags.length ? `<div class="frow"><span class="flbl">태그</span>${tags.map(([t, n]) => `<button class="chip ${S.tag === t ? "on" : ""}" type="button" data-tag="${esc(t)}">#${esc(t)} <span class="mono">${n}</span></button>`).join("")}</div>` : ""}
  </div>

}

const INVESTING_CAL = "https://kr.investing.com/economic-calendar/";
const kst = () => new Date(Date.now() + 9 * 3600e3);
const todayStr = () => kst().toISOString().slice(0, 10);
const dname = ds => ["일", "월", "화", "수", "목", "금", "토"][new Date(ds + "T00:00:00Z").getUTCDay()];
const flag = c => c === "kr" ? `<span class="tag kr">한국</span>` : `<span class="tag us">미국</span>`;

// 달력 칸용 짧은 이름: Claude가 만든 short가 있으면 그걸, 없으면 규칙으로 줄이기
const SHORT_RULES = [
  [/(금통위|금융통화).*의사록/, "금통위록"], [/의사록/, "FOMC록"], [/FOMC|연준.*금리/, "FOMC"], [/금융통화위원회|금통위/, "금통위"],
  [/PCE|개인소비지출/, "PCE"], [/CPI|소비자물가/, "CPI"], [/PPI|생산자물가/, "PPI"],
  [/고용보고서|비농업/, "고용"], [/실업수당/, "실업수당"], [/JOLTS|구인/, "구인"], [/GDP/, "GDP"],
  [/소매판매/, "소매판매"], [/ISM.*제조/, "ISM 제조"], [/ISM.*서비스/, "ISM 서비스"], [/PMI/, "PMI"],
  [/미시간/, "미시간대"], [/콘퍼런스보드|컨퍼런스보드|소비자신뢰/, "소비자신뢰"],
  [/수출입|수출/, "수출"], [/동시만기|선물옵션/, "동시만기"], [/쿼드러플|위칭|옵션.?만기/, "옵션만기"],
  [/조기.?폐장/, "조기폐장"], [/휴장|추수감사절|크리스마스|성탄/, "휴장"], [/산업생산|광공업/, "산업생산"],
  [/주택|착공/, "주택"], [/내구재/, "내구재"],
];
function shortName(e) {
  if (e.short) return e.short;
  const t = e.title || "";
  const earn = t.match(/^(.+?)\s*(?:\d분기|FY|회계)?\s*실적/);
  if (earn) return earn[1].replace(/\(.*?\)/g, "").trim().slice(0, 6);
  for (const [re, name] of SHORT_RULES) if (re.test(t)) return name;
  return t.replace(/^\d+월\s*/, "").replace(/\(.*?\)/g, "").trim().slice(0, 6);
}

function evRow(e) {
  return `<div class="evrow"><span class="mono">${esc(e.time || "–")}</span>
    <span class="t ${e.importance >= 3 ? "i3" : ""}">${e.importance >= 3 ? `<span class="star">★ </span>` : ""}${flag(e.country)} ${esc(e.title)}
    ${e.note ? `<small>${esc(e.note)}</small>` : ""}</span></div>`;
}

function upcomingEvents(days = 7) {
  const evs = S.cal?.events || [], t = todayStr();
  const end = new Date(Date.parse(t) + days * 864e5).toISOString().slice(0, 10);
  return evs.filter(e => e.date >= t && e.date <= end);
}

function viewCalendar() {
  const evs = S.cal?.events || [];
  const t = todayStr();
  if (!S.calMonth) S.calMonth = t.slice(0, 7);
  const [y, m] = S.calMonth.split("-").map(Number);
  const byDate = {};
  evs.filter(e => e.date.startsWith(S.calMonth)).forEach(e => (byDate[e.date] = byDate[e.date] || []).push(e));

  // 월~금 달력 칸 만들기
  const first = new Date(Date.UTC(y, m - 1, 1)), last = new Date(Date.UTC(y, m, 0));
  const start = new Date(first); start.setUTCDate(1 - ((first.getUTCDay() + 6) % 7));
  const cells = [];
  let week = [], selWeek = false;
  const flush = () => {
    cells.push(...week);
    if (selWeek && S.calDay) {
      const l = (byDate[S.calDay] || []).sort((a, b) => (a.time || "99").localeCompare(b.time || "99"));
      cells.push(`<div class="daypanel" role="region" aria-label="선택한 날 일정"><div class="ph"><b>${+S.calDay.slice(5, 7)}월 ${+S.calDay.slice(8)}일 (${dname(S.calDay)})</b>
        <button type="button" data-calday="${S.calDay}" aria-label="닫기">×</button></div>
        ${l.length ? l.map(evRow).join("") : `<p class="desc" style="margin:2px 0 4px">이날은 등록된 일정이 없습니다.</p>`}</div>`);
    }
    week = []; selWeek = false;
  };
  for (let d = new Date(start); d <= last || d.getUTCDay() !== 1; d.setUTCDate(d.getUTCDate() + 1)) {
    const wd = d.getUTCDay();
    if (wd === 6) continue;
    if (wd === 0) { flush(); continue; }
    const ds = d.toISOString().slice(0, 10), inMonth = d.getUTCMonth() === m - 1;
    const list = (byDate[ds] || []).sort((a, b) => b.importance - a.importance);
    const hot = list.some(e => e.importance >= 3);
    if (ds === S.calDay) selWeek = true;
    if (!inMonth) { week.push(`<div class="cell out"><span class="d">${d.getUTCDate()}</span></div>`); continue; }
    week.push(`<button type="button" class="cell ${hot ? "hot" : ""} ${ds === t ? "today" : ""} ${ds === S.calDay ? "sel" : ""}" data-calday="${ds}" aria-label="${m}월 ${d.getUTCDate()}일 일정 ${list.length}건">
      <span class="d">${d.getUTCDate()}</span>
      ${list.slice(0, 3).map(e => `<span class="ev ${e.importance >= 3 ? "i3" : ""}"><i class="${e.country === "kr" ? "kr" : "us"}"></i>${e.importance >= 3 ? "★" : ""}${esc(shortName(e))}</span>`).join("")}
      ${list.length > 3 ? `<span class="more2">+${list.length - 3}</span>` : ""}</button>`);
  }
  flush();
  // 주말 일정은 달력 칸에는 빠지지만 아래 목록에는 나옴
  const days = Object.keys(byDate).sort();
  const upd = S.cal?.updated?.[S.calMonth];
  return `
  <div class="shead"><div><h2 style="margin:0;font-family:var(--f-display);font-size:21px">경제 일정 달력</h2>
    <p class="desc" style="margin:4px 0 0;color:var(--sub)">시간은 한국시간. ★는 시장 영향이 큰 일정${upd ? ` · ${esc(upd.slice(5, 10).replace("-", "."))} 확인` : ""}</p></div>
    <div class="frow"><span class="calnav"><button type="button" data-calmove="-1" aria-label="이전 달">‹</button><b>${y}년 ${m}월</b><button type="button" data-calmove="1" aria-label="다음 달">›</button></span>
    <a class="extlink" href="${INVESTING_CAL}" target="_blank" rel="noopener">Investing.com 캘린더</a></div></div>
  ${S.cal?.sample ? `<div class="notice">달력의 일정은 화면 확인용 예시입니다. 자동 실행이 시작되면 실제 일정으로 바뀝니다.</div>` : ""}
  <div class="cal">${["월", "화", "수", "목", "금"].map(d => `<span class="dow">${d}</span>`).join("")}${cells.join("")}</div>
  <div class="legend"><span><i style="background:var(--down)"></i>미국</span><span><i style="background:var(--up)"></i>한국</span><span style="color:var(--accent)">★ 중요</span><span>날짜를 누르면 그날 일정이 펼쳐집니다</span></div>
  <section class="sec"><h2>${m}월 일정 목록</h2>
    <p class="desc">일정은 한 달에 한 번 Claude가 웹 검색으로 확인해 채웁니다. 발표 직전에는 Investing.com에서 시간을 한 번 더 확인하세요.</p>
    ${days.length ? `<div class="list evlist">${days.map(ds => `<div class="day"><div class="dh ${ds === t ? "today" : ""}">${+ds.slice(5, 7)}월 ${+ds.slice(8)}일 (${dname(ds)})</div>${byDate[ds].sort((a, b) => (a.time || "99").localeCompare(b.time || "99")).map(evRow).join("")}</div>`).join("")}</div>`
      : `<p class="empty">이 달의 일정이 아직 없습니다. 이번 달과 다음 달 일정은 자동으로 채워집니다.</p>`}
  </section>
  `;
}

function viewSeason() {
  const head = `<div class="shead"><div><h2 style="margin:0;font-family:var(--f-display);font-size:21px">월별 등락</h2>
    <p class="desc" style="margin:4px 0 0;color:var(--sub)">달마다 역사적으로 얼마나 오르고 내렸는지 (월말 종가 기준)</p></div></div>`;
  const list = S.season?.indices || [];
  if (!list.length) return head + `<p class="empty">아직 데이터가 없습니다. 다음 자동 실행 때 채워집니다.</p>`;
  const ix = list[Math.min(S.seasonIdx, list.length - 1)];
  const [cy, cm] = ix.current.split("-").map(Number);
  const mon = S.seasonMon || cm;
  // 기간 선택: 전체 / 최근 10년 / 최근 5년 (진행 중인 이번 달은 제외)
  const win = S.seasonWin;
  const stats = win === "all" ? ix.stats : [...Array(12)].map((_, i) => {
    const vals = Object.keys(ix.years).sort().reverse()
      .filter(y => !(+y === cy && i + 1 === cm) && ix.years[y][i] != null)
      .slice(0, +win).map(y => ix.years[y][i]);
    if (!vals.length) return null;
    const so = [...vals].sort((a, b) => a - b), mid = so.length >> 1;
    return {avg: +(vals.reduce((a, b) => a + b, 0) / vals.length).toFixed(2),
      median: +(so.length % 2 ? so[mid] : (so[mid - 1] + so[mid]) / 2).toFixed(2),
      up: Math.round(vals.filter(v => v > 0).length / vals.length * 100), n: vals.length,
      best: Math.max(...vals), worst: Math.min(...vals)};
  });
  const winLabel = win === "all" ? `${Object.keys(ix.years).sort()[0]}년부터 전체` : `최근 ${win}년`;
  const st = stats[mon - 1];
  const cls = v => v == null ? "" : dir(v);
  const yrs = Object.keys(ix.years).sort().reverse();
  const first = yrs[yrs.length - 1];

  // 12개월 평균 막대
  const maxAvg = Math.max(...stats.map(x => x ? Math.abs(x.avg) : 0), .5);
  const chart = stats.map((x, i) => {
    const m = i + 1, v = x ? x.avg : 0, h = Math.abs(v) / maxAvg * 50;
    const pos = v >= 0 ? `bottom:50%;height:${h}%` : `top:50%;height:${h}%`;
    return `<button type="button" class="mcol ${m === mon ? "sel" : ""}" data-seasonmon="${m}" aria-label="${m}월 평균 ${x ? pct(x.avg) : "없음"}">
      <span class="v ${cls(v)}">${x ? (v > 0 ? "+" : "") + v.toFixed(1) : ""}</span>
      <span class="area"><span class="b" style="${pos};background:var(--${dir(v)})"></span></span>
      <span class="m">${m}월</span><span class="u">${x ? x.up + "%" : ""}</span></button>`;
  }).join("");

  // 선택한 달의 연도별 기록
  const monRows = yrs.map(y => [y, ix.years[y][mon - 1]]).filter(([, v]) => v != null);
  const shownRows = S.seasonAll ? monRows : monRows.slice(0, 15);
  const maxY = Math.max(...monRows.map(([, v]) => Math.abs(v)), 1);
  const yearBars = shownRows.map(([y, v]) => { const w = Math.abs(v) / maxY * 50;
    return `<div class="yr"><span class="mono">${y}${+y === cy && mon === cm ? "*" : ""}</span><div class="track"><div class="fill" style="${v >= 0 ? `left:50%;width:${w}%` : `left:${50 - w}%;width:${w}%`};background:var(--${dir(v)})"></div></div><span class="v ${dir(v)}">${pct(v)}</span></div>`; }).join("");

  const M = [...Array(12)].map((_, i) => i + 1);
  const heatBg = v => { if (v == null) return ""; const a = Math.min(Math.abs(v) / 10, 1) * .55 + .06;
    return `background:${v >= 0 ? `rgba(207,46,62,${a})` : `rgba(31,95,198,${a})`}`; };

  return head + `
  <div class="frow" style="margin-top:12px">${list.map((x, i) => `<button class="chip ${i === S.seasonIdx ? "on" : ""}" type="button" data-season="${i}">${esc(x.name)}</button>`).join("")}</div>
  ${S.season?.sample ? `<div class="notice">아래 수익률은 화면 확인용 예시 숫자입니다. 자동 실행 후 실제 과거 데이터로 바뀝니다.</div>` : ""}

  <div class="frow" style="margin-top:8px"><span class="flbl">기간</span>${[["all", "전체"], ["10", "최근 10년"], ["5", "최근 5년"]].map(([v, l]) => `<button class="chip ${win === v ? "on" : ""}" type="button" data-seasonwin="${v}">${l}</button>`).join("")}</div>

  <section class="sec"><h2>월별 평균 수익률</h2>
    <p class="desc">${esc(ix.name)} · ${winLabel}. 막대 아래 숫자는 그 달에 오른 해의 비율입니다. 막대를 누르면 그 달을 자세히 봅니다</p>
    <div class="mchart">${chart}</div></section>

  <section class="sec"><h2>${mon}월은 어땠나 <span class="mono" style="font-size:13px;font-weight:400">${winLabel}</span></h2>
    ${st ? `<div class="season-sum">
      <div class="fact"><b class="${cls(st.avg)}">${pct(st.avg)}</b><span>평균</span></div>
      <div class="fact"><b>${st.up}%</b><span>상승 확률 (${st.n}년 중 ${Math.round(st.up * st.n / 100)}번)</span></div>
      <div class="fact"><b class="up">${pct(st.best)}</b><span>가장 좋았던 해</span></div>
      <div class="fact"><b class="down">${pct(st.worst)}</b><span>가장 나빴던 해</span></div></div>` : ""}
    <h3 style="margin:16px 0 0;font-size:15px">역대 ${mon}월 기록</h3>
    <p class="desc">${mon === cm ? "올해(*)는 이번 달이 진행 중이라 지금까지의 수익률입니다" : "최근 연도부터"}</p>
    <div class="yrs">${yearBars || `<p class="empty">기록 없음</p>`}</div>
    ${monRows.length > 15 ? `<button class="more" type="button" data-seasonall="1">${S.seasonAll ? "최근 15년만 보기" : `전체 ${monRows.length}년 보기`}</button>` : ""}
  </section>

  <section class="sec"><h2>월별 통계 <span class="mono" style="font-size:13px;font-weight:400">${winLabel}</span></h2>
    <div class="tablewrap"><table><thead><tr><th>월</th><th class="n">평균</th><th class="n hide-m">중앙값</th><th class="n">상승 확률</th><th class="n">최고</th><th class="n">최저</th></tr></thead><tbody>
      ${stats.map((s2, i) => s2 ? `<tr ${i + 1 === mon ? 'style="background:var(--accent-soft)"' : ""}><td class="nm">${i + 1}월</td><td class="n ${cls(s2.avg)}"><b>${pct(s2.avg)}</b></td><td class="n hide-m ${cls(s2.median)}">${pct(s2.median)}</td>
        <td class="n">${s2.up}%</td><td class="n up">${pct(s2.best)}</td><td class="n down">${pct(s2.worst)}</td></tr>` : "").join("")}
    </tbody></table></div>
  </section>

  <details class="heatwrap"><summary>연도별 전체 표 보기 (${yrs.length}년)</summary>
    <div class="tablewrap"><table class="heat"><thead><tr><th>연도</th>${M.map(i => `<th>${i}월</th>`).join("")}</tr></thead><tbody>
      ${yrs.map(y => `<tr><td>${y}</td>${ix.years[y].map((v, i) => `<td class="${+y === cy && i + 1 === cm ? "cur" : ""}" style="${heatBg(v)}">${v == null ? "" : (v > 0 ? "+" : "") + v.toFixed(1)}</td>`).join("")}</tr>`).join("")}
      <tr class="sum"><td>평균</td>${ix.stats.map(s2 => `<td class="${s2 ? cls(s2.avg) : ""}">${s2 ? (s2.avg > 0 ? "+" : "") + s2.avg.toFixed(1) : ""}</td>`).join("")}</tr>
    </tbody></table></div></details>`;
}

function viewLinks() {
  return `
  <div class="shead"><div><h2 style="margin:0;font-family:var(--f-display);font-size:21px">바로가기</h2>
    <p class="desc" style="margin:4px 0 0;color:var(--sub)">원 출처에서 수치와 공시를 직접 확인할 때 쓰는 사이트</p></div></div>
  <div class="links">${LINKS.map(([g, items]) => `<section class="sec" style="margin-top:14px"><h2>${g}</h2>
    <div class="tablewrap"><table><tbody>${items.map(([n, u, dsc]) => `<tr><td class="nm"><a href="${u}" target="_blank" rel="noopener">${n}</a></td><td class="mono" style="font-family:var(--f-body);font-size:13px">${dsc}</td></tr>`).join("")}</tbody></table></div></section>`).join("")}</div>`;
}

/* ── 렌더 ───────────────────────────────────── */
function renderTabs() {
  $("#tabs").innerHTML = TABS.map(([k, l]) => {
    const cnt = k === "archive" ? `<span class="cnt">${S.index.length}</span>` : k === "news" ? `<span class="cnt">${(S.doc?.news || []).length}</span>` : "";
    return `<button class="tab ${S.tab === k ? "on" : ""}" type="button" data-tab="${k}" ${S.tab === k ? 'aria-current="page"' : ""}>${l}${cnt}</button>`;
  }).join("");
  // 선택한 탭이 탭줄 밖에 있으면 보이도록 옆으로 밀기
  const on = $("#tabs .tab.on"), bar = $("#tabs");
  if (on && (on.offsetLeft < bar.scrollLeft || on.offsetLeft + on.offsetWidth > bar.scrollLeft + bar.clientWidth))
    bar.scrollLeft = on.offsetLeft - (bar.clientWidth - on.offsetWidth) / 2;
}

function render() {
  renderTabs();
  if (!S.doc) return;
  const v = {home: viewHome, us: () => viewMarket("us"), kr: () => viewMarket("kr"), macro: viewMacro, coin: viewCoin, calendar: viewCalendar, season: viewSeason, news: viewNews, archive: viewArchive, links: viewLinks}[S.tab] || viewHome;
  $("#view").innerHTML = v();
  document.title = `${S.doc.headline} | 나스닥·코스피 브리핑 아카이브`;
  const sync = $("#sync");
  sync.className = "sync" + (S.doc.sample ? " sample" : "");
  sync.querySelector("span").textContent = S.doc.sample ? "예시 데이터" : `${md(S.doc.date)} ${sesName(S.doc.session)} 반영`;
  const aq = $("#archQ");
  if (aq) aq.addEventListener("input", e => { S.q = e.target.value; const pos = e.target.selectionStart; render(); const n = $("#archQ"); n.focus(); n.setSelectionRange(pos, pos); });
}

function setTab(t) {
  S.tab = t;
  try { history.replaceState(null, "", t === "home" ? location.pathname + location.search : `#${t}`); } catch {}
  render();
  const tabsTop = $("#tabs").offsetTop - (window.matchMedia("(max-width:820px)").matches ? 0 : $(".top").offsetHeight) - 2;
  if (window.scrollY > tabsTop) window.scrollTo({top: Math.max(tabsTop, 0)});
}

async function openBrief(key) {
  try {
    S.doc = await getDoc(key);
    S.key = key;
    $("#pick").value = key;
    setTab("home");
  } catch {
    $("#view").innerHTML = `<p class="empty">그 브리핑 파일을 찾지 못했습니다.</p>`;
  }
}

function fillPicker() {
  $("#pick").innerHTML = `<option value="latest">최신 브리핑</option>` +
    S.index.map(e => `<option value="${esc(e.key)}">${md(e.date)} ${sesName(e.session)}${e.session === "intraday" && e.time ? " " + esc(e.time) : ""}</option>`).join("");
  $("#pick").value = S.key;
}

document.addEventListener("click", e => {
  const t = e.target.closest("[data-tab],[data-open],[data-month],[data-ses],[data-tag],[data-tagjump],[data-newsmk],[data-calmove],[data-season],[data-seasonall],[data-calday],[data-stocksort],[data-krboard],[data-anamk],[data-krcap],[data-seasonmon],[data-seasonwin]");
  if (!t) return;
  const ds = t.dataset;
  if (ds.tab) return setTab(ds.tab);
  if (ds.open) return openBrief(ds.open);
  if (ds.month) S.month = ds.month;
  if (ds.ses) S.ses = ds.ses;
  if (ds.tag) S.tag = S.tag === ds.tag ? null : ds.tag;
  if (ds.tagjump) { S.tag = ds.tagjump; S.q = ""; S.month = "all"; S.ses = "all"; return setTab("archive"); }
  if (ds.newsmk) S.newsMk = ds.newsmk;
  if (ds.calmove) { S.calDay = null; }
  if (ds.calmove) { const [yy, mm] = (S.calMonth || todayStr().slice(0, 7)).split("-").map(Number); const nd = new Date(Date.UTC(yy, mm - 1 + +ds.calmove, 1)); S.calMonth = nd.toISOString().slice(0, 7); }
  if (ds.season) S.seasonIdx = +ds.season;
  if (ds.stocksort) S.stockSort = ds.stocksort;
  if (ds.krboard) S.krBoard = ds.krboard;
  if (ds.anamk) S.anaMk = ds.anamk;
  if (ds.krcap) S.krCap = ds.krcap;
  if (ds.seasonwin) S.seasonWin = ds.seasonwin;
  if (ds.seasonmon) { S.seasonMon = +ds.seasonmon; S.seasonAll = false; }
  if (ds.calday) S.calDay = S.calDay === ds.calday ? null : ds.calday;
  if (ds.seasonall) S.seasonAll = !S.seasonAll;
  render();
});
$("#brand").addEventListener("click", () => openBrief("latest"));
$("#pick").addEventListener("change", e => openBrief(e.target.value));
$("#searchForm").addEventListener("submit", e => {
  e.preventDefault();
  S.q = $("#topQ").value; S.tag = null; S.month = "all"; S.ses = "all";
  setTab("archive");
});
// 홈 화면 앱은 오래 켜져 있으니, 다시 화면에 돌아오면 최신 브리핑을 확인
document.addEventListener("visibilitychange", async () => {
  if (document.visibilityState !== "visible" || EMBED || S.key !== "latest") return;
  try {
    const fresh = await getJSON("data/latest.json");
    if (fresh.generated_at !== S.doc?.generated_at) {
      S.cache.latest = fresh; S.doc = fresh; S.index = await getIndex(); fillPicker(); render();
    }
  } catch {}
});
window.addEventListener("hashchange", () => {
  const h = location.hash.slice(1);
  if (TABS.some(([k]) => k === h) && h !== S.tab) { S.tab = h; render(); }
});

const setTopH = () => document.documentElement.style.setProperty("--topH", $(".top").offsetHeight + "px");
setTopH(); window.addEventListener("resize", setTopH);

(async () => {
  const h = location.hash.slice(1);
  if (TABS.some(([k]) => k === h)) S.tab = h;
  renderTabs();
  try {
    [S.doc, S.index, S.cal, S.season] = await Promise.all([getDoc("latest"), getIndex(), getExtra("calendar"), getExtra("seasonality")]);
    fillPicker();
    render();
  } catch {
    $("#view").innerHTML = `<p class="empty">최신 브리핑(data/latest.json)을 찾지 못했습니다. GitHub Actions에서 워크플로를 한 번 실행해 주세요.</p>`;
  }
})();
</script>
</body>
</html>
